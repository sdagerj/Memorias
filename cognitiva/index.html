<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enfoque se mudó</title>
  <meta http-equiv="refresh" content="0; url=https://sdagerj.github.io/Enfoque/">
  <link rel="canonical" href="https://sdagerj.github.io/Enfoque/">
  <style>
    body { font-family: system-ui, sans-serif; background: #faf8f5; color: #2b2622;
           max-width: 32rem; margin: 4rem auto; padding: 0 16px; line-height: 1.5; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Enfoque tiene nueva dirección</h1>
  <p>Te llevamos a <a href="https://sdagerj.github.io/Enfoque/">sdagerj.github.io/Enfoque</a>.
     Tus datos siguen ahí. Si la tenías en la pantalla de inicio, vuelve a añadirla desde la dirección nueva.</p>
  <script>
    // Retira la versión instalada aquí para que no siga abriendo la copia vieja.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registros) => {
        registros.filter((r) => r.scope.endsWith('/Memorias/cognitiva/')).forEach((r) => r.unregister())
      })
    }
    location.replace('https://sdagerj.github.io/Enfoque/')
  </script>
</body>
</html>
