name: Publicar Memorias en GitHub Pages

# Publica la app (PWA) en una dirección web con HTTPS para poder
# instalarla en el celular. Se ejecuta sola al subir cambios.

on:
  push:
    branches:
      - claude/memory-book-app-10p7j3
      - claude/mobile-app-install-jar3ab
  workflow_dispatch:

# Permisos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos pisándose entre sí.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar (y activar) GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
